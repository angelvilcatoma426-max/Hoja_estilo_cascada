<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Usuarios | GAME LIVE CENTER</title>
    <style>
        :root {
            --bg: #0b0f0c;
            --panel: #111;
            --line: #00ff88;
            --text: #f5f5f5;
            --muted: #aab8b2;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, var(--bg), #132018);
            color: var(--text);
            min-height: 100vh;
        }

        .usuarios-shell {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 24px 60px;
        }

        .panel-usuarios,
        .panel-usuario {
            background: rgba(17, 17, 17, 0.95);
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 24px;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.12);
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .eyebrow {
            color: var(--line);
            font-size: 0.8rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin: 0 0 6px;
            font-weight: bold;
        }

        h1 {
            margin: 0;
            color: #fff;
        }

        .boton-volver {
            display: inline-block;
            text-decoration: none;
            background: var(--line);
            color: #000;
            padding: 10px 16px;
            border-radius: 999px;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            border-bottom: 1px solid #1f2d24;
            padding: 12px 10px;
            text-align: left;
            vertical-align: top;
        }

        th {
            color: var(--line);
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        .estado-vacio {
            color: var(--muted);
            font-style: italic;
        }

        .tarjeta-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
            margin-bottom: 8px;
            padding: 8px 10px;
            background: #181818;
            border-radius: 8px;
        }

        .perfil-card {
            display: grid;
            gap: 14px;
            margin-top: 8px;
        }

        .perfil-dato {
            border: 1px solid #232e25;
            border-radius: 10px;
            padding: 12px 14px;
            background: #161616;
        }

        .perfil-dato strong {
            display: block;
            color: var(--line);
            margin-bottom: 4px;
            font-size: 0.8rem;
            text-transform: uppercase;
        }

        .tarjetas-lista {
            display: grid;
            gap: 8px;
            margin-top: 6px;
        }

        @media (max-width: 768px) {
            .usuarios-shell { padding: 24px 16px 40px; }
            table { font-size: 0.9rem; }
        }
    </style>
</head>
<body>
    <main class="usuarios-shell">
        <div id="appUsuarios"></div>
    </main>

    <script src="ususarios.js"></script>
</body>
</html>
